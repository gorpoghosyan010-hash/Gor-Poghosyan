# GARON — ադմին վահանակի (Sveltia CMS) կարգավորումներ
# Ուղեցույց՝ CONTENT-GUIDE.md. Նախագծերի ֆայլերը՝ content/projects/<slug>.json, նկարները՝ public/projects/<slug>/
# Կարևոր. CMS-ը գրում է `main` ճյուղում (Vercel-ը հրապարակում է այդ ճյուղը). այս կարգավորումն աշխատում է
# միայն այն բանից հետո, երբ այս փոփոխությունները միացված (merged) են main-ին։
backend:
  name: github
  repo: gorpoghosyan010-hash/gor-poghosyan
  branch: main
  # Մուտք՝ GitHub-ի անձնական token-ով (fine-grained, Contents: Read and write միայն այս repo-ի համար)։
  # OAuth («Sign in with GitHub») պետք է առանձին authenticator (sveltia-cms-auth). միացնելուց հետո ավելացնել
  # `base_url: https://<ձեր-authenticator>` և `auth_methods: [oauth, token]`։
  auth_methods: [token]
  commit_messages:
    create: 'Նախագիծ ավելացված՝ {{slug}} (CMS)'
    update: 'Նախագիծ թարմացված՝ {{slug}} (CMS)'
    delete: 'Նախագիծ ջնջված՝ {{slug}} (CMS)'
    uploadMedia: 'Նկար բեռնված՝ {{path}} (CMS)'
    deleteMedia: 'Նկար ջնջված՝ {{path}} (CMS)'

site_url: https://garon.am
display_url: https://garon.am
logo:
  src: /brand/garon-mark-dark.svg

# Ընդհանուր նկարների պանակ (օգտագործվում է միայն ընդհանուր «Մեդիա» բաժնում)
media_folder: public/projects
public_folder: /projects

media_libraries:
  default:
    config:
      max_file_size: 26214400 # 25 ՄԲ
      slugify_filename: true
      # Բեռնելիս նկարը ավտոմատ փոքրացվում է (առավելագույնը 2000px լայնք) և դառնում WebP (որակ 80)
      transformations:
        raster_image:
          format: webp
          quality: 80
          width: 2000
          height: 2000

collections:
  - name: projects
    label: Նախագծեր
    label_singular: Նախագիծ
    description: >-
      Կայքի նախագծերը։ Ամեն նախագիծ ավտոմատ հայտնվում է իր բաժնում (Նախագծեր էջ, ծառայության էջ, sitemap)։
      «Հրապարակել»-ից հետո կայքը թարմանում է 1–3 րոպեում։
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: slug
    slug: '{{fields.slug}}'
    summary: '{{title.hy}} · {{category}} · {{slug}}'
    sortable_fields: [order, category, slug]
    view_groups:
      - label: Բաժին
        field: category
    media_folder: /public/projects/{{slug}}
    public_folder: /projects/{{slug}}
    fields:
      - name: title
        label: Անվանում
        widget: object
        hint: Օր.՝ «Տուն Աբովյանում» կամ «Լողավազան»։ Հայերենը պարտադիր է, en/ru-ն՝ ոչ (դատարկ → կցուցադրվի հայերենը)։
        fields:
          - { name: hy, label: Հայերեն, widget: string }
          - { name: en, label: English, widget: string, required: false }
          - { name: ru, label: Русский, widget: string, required: false }
      - name: slug
        label: Հասցե կայքում (slug)
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Միայն լատինական փոքրատառեր, թվեր և գծիկ, օր.՝ house-02']
        hint: >-
          Լատինատառ, օր.՝ house-02 → կայքում՝ garon.am/projects/house-02։ Ստեղծելուց հետո չփոխել
          (կփոխվի հասցեն, և նկարների պանակը)։
      - name: category
        label: Բաժին
        widget: select
        default: houses
        options:
          - { label: Տներ, value: houses }
          - { label: Լողավազաններ, value: pools }
          - { label: Վերանորոգում, value: renovation }
          - { label: Հասարակական, value: public }
      - name: published
        label: Հրապարակված
        widget: boolean
        default: true
        hint: Անջատեք՝ նախագիծը կայքից թաքցնելու համար (ֆայլը և նկարները չեն ջնջվում)։
      - name: featured
        label: Ցույց տալ գլխավոր էջում
        widget: boolean
        default: false
        required: false
        hint: Գլխավոր էջում ցուցադրվում են առավելագույնը 3 նշված նախագիծ։
      - name: order
        label: Հերթականություն բաժնում
        widget: number
        value_type: int
        default: 10
        hint: Փոքր թիվը՝ առաջինը (10, 20, 30…)։ Հավասար թվերի դեպքում ավելի նորը՝ առաջինը։
      - name: created
        label: Ավելացման ամսաթիվ
        widget: datetime
        time_format: false
        date_format: YYYY-MM-DD
        format: YYYY-MM-DD
        default: '{{now}}'
        required: false
      - name: status
        label: Կարգավիճակ
        widget: select
        required: false
        default: completed
        options:
          - { label: Ավարտված, value: completed }
          - { label: Ընթացքի մեջ, value: in-progress }
      - name: heroImage
        label: Գլխավոր նկար
        widget: image
        required: false
        hint: Վերևի մեծ նկարը և քարտի նկարը։ Դատարկ → կօգտագործվի ցուցակի առաջին նկարը։
      - name: images
        label: Նկարներ (քաշեք՝ հերթականությունը փոխելու համար)
        label_singular: Նկար
        widget: list
        collapsed: true
        summary: '{{fields.stage}} · {{fields.src}}'
        hint: Կայքում նկարները ցուցադրվում են հենց այս հերթականությամբ։ Քաշեք ⠿ նշանով՝ վեր/վար տեղափոխելու համար։
        fields:
          - name: src
            label: Նկար
            widget: image
          - name: stage
            label: Փուլ
            widget: select
            required: false
            options:
              - { label: Սկիզբ, value: start }
              - { label: Ընթացք, value: progress }
              - { label: Արդյունք, value: result }
          - name: caption
            label: Նկարագրություն (ոչ պարտադիր)
            widget: object
            required: false
            collapsed: true
            fields:
              - { name: hy, label: Հայերեն, widget: string, required: false }
              - { name: en, label: English, widget: string, required: false }
              - { name: ru, label: Русский, widget: string, required: false }
      - name: subtitle
        label: Ենթավերնագիր (ոչ պարտադիր)
        widget: object
        required: false
        collapsed: true
        hint: Ոսկեգույն տողը վերնագրի տակ, օր.՝ «Ամբողջ ճանապարհը»։
        fields:
          - { name: hy, label: Հայերեն, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
          - { name: ru, label: Русский, widget: string, required: false }
      - name: summary
        label: Կարճ նկարագրություն (ոչ պարտադիր)
        widget: object
        required: false
        collapsed: true
        hint: 1 նախադասություն՝ գլխավոր նկարի վրա։
        fields:
          - { name: hy, label: Հայերեն, widget: text, required: false }
          - { name: en, label: English, widget: text, required: false }
          - { name: ru, label: Русский, widget: text, required: false }
      - name: cardText
        label: Քարտի տող (ոչ պարտադիր)
        widget: object
        required: false
        collapsed: true
        hint: Կարճ տող նախագծի քարտի վրա, օր.՝ «Բնակելի առանձնատուն · ավարտված»։ Դատարկ → ենթավերնագիրը։
        fields:
          - { name: hy, label: Հայերեն, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
          - { name: ru, label: Русский, widget: string, required: false }
      - name: story
        label: Նախագծի պատմությունը (ոչ պարտադիր)
        widget: object
        required: false
        collapsed: true
        hint: Մի քանի նախադասություն նկարներից առաջ։ Դատարկ → բաժինը չի ցուցադրվում։
        fields:
          - { name: hy, label: Հայերեն, widget: text, required: false }
          - { name: en, label: English, widget: text, required: false }
          - { name: ru, label: Русский, widget: text, required: false }
      - name: introTitle
        label: Պատմության վերնագիր (ոչ պարտադիր)
        widget: object
        required: false
        collapsed: true
        hint: Դատարկ → «Սկիզբից մինչև / վերջնական արդյունք։»
        fields:
          - { name: hy, label: Հայերեն, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
          - { name: ru, label: Русский, widget: string, required: false }
      - name: introTitle2
        label: Պատմության վերնագրի 2-րդ տող (ոսկեգույն, ոչ պարտադիր)
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: hy, label: Հայերեն, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
          - { name: ru, label: Русский, widget: string, required: false }
      - name: facts
        label: Փաստեր (ոչ պարտադիր, դատարկը չի ցուցադրվում)
        widget: object
        required: false
        collapsed: true
        fields:
          - name: location
            label: Վայր (համայնք/քաղաք)
            widget: object
            required: false
            fields:
              - { name: hy, label: Հայերեն, widget: string, required: false }
              - { name: en, label: English, widget: string, required: false }
              - { name: ru, label: Русский, widget: string, required: false }
          - { name: area_m2, label: Մակերես (մ²), widget: number, value_type: float, required: false }
          - name: duration
            label: Տևողություն (օր.՝ «8 ամիս»)
            widget: object
            required: false
            fields:
              - { name: hy, label: Հայերեն, widget: string, required: false }
              - { name: en, label: English, widget: string, required: false }
              - { name: ru, label: Русский, widget: string, required: false }
          - { name: year, label: Տարի, widget: number, value_type: int, required: false }
